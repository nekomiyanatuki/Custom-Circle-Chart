<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Circle Chart</title>
    <!-- グラフ描画用ライブラリ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- 画像は個別に指定。* は使えません -->
    <img src="images/test-image.png" alt="説明">
</head>
<body>

<div class="panel">
    <h3>① デザイン変更</h3>
    <div class="form-group">
        <label for="gridStyle">網目の形状</label>
        <select id="gridStyle">
            <option value="polygon">多角形（標準）</option>
            <option value="circle">正円（カスタム）</option>
        </select>
    </div>
    <div class="form-group">
        <label for="colorTheme">カラーテーマ</label>
        <select id="colorTheme">
            <option value="blue">ブルー（標準）</option>
            <option value="red">レッド</option>
            <option value="green">グリーン</option>
            <option value="orange">オレンジ</option>
        </select>
    </div>

    <h3>② 項目の編集・数値入力</h3>
    <div id="valueInputs"></div>
    <button class="btn btn-add" id="addBtn">+ 新しい項目を追加</button>
</div>

<div class="chart-container">
    <div class="canvas-wrapper">
        <canvas id="customRadarChart"></canvas>
    </div>
    <button class="btn btn-save" id="saveBtn">📸 グラフを画像(PNG)として保存</button>
</div>

<script>
    // 初期データ（10項目）
    let chartData = [
        { label: '項目1', value: 80 },
        { label: '項目2', value: 70 },
        { label: '項目3', value: 65 },
        { label: '項目4', value: 85 },
        { label: '項目5', value: 50 },
        { label: '項目6', value: 90 },
        { label: '項目7', value: 75 },
        { label: '項目8', value: 60 },
        { label: '項目9', value: 80 },
        { label: '項目10', value: 70 }
    ];

    const colorThemes = {
        blue: { line: 'rgba(54, 162, 235, 1)', bg: 'rgba(54, 162, 235, 0.2)', point: 'rgba(54, 162, 235, 1)' },
        red: { line: 'rgba(255, 99, 132, 1)', bg: 'rgba(255, 99, 132, 0.2)', point: 'rgba(255, 99, 132, 1)' },
        green: { line: 'rgba(75, 192, 192, 1)', bg: 'rgba(75, 192, 192, 0.2)', point: 'rgba(75, 192, 192, 1)' },
        orange: { line: 'rgba(255, 159, 64, 1)', bg: 'rgba(255, 159, 64, 0.2)', point: 'rgba(255, 159, 64, 1)' }
    };

    const inputsContainer = document.getElementById('valueInputs');
    const canvas = document.getElementById('customRadarChart');
    const ctx = canvas.getContext('2d');

    // グラフの描画
    const myChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: chartData.map(d => d.label),
            datasets: [{
                data: chartData.map(d => d.value),
                backgroundColor: colorThemes.blue.bg,
                borderColor: colorThemes.blue.line,
                borderWidth: 2,
                pointBackgroundColor: colorThemes.blue.point,
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            animation: {
                duration: 150 
            },
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    grid: {
                        color: 'rgba(0, 0, 0, 0.1)',
                        circular: false
                    },
                    angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
                    ticks: {
                        stepSize: 20,
                        backdropColor: 'transparent',
                        color: '#666'
                    }
                }
            }
        },
        plugins: [{
            id: 'custom_canvas_background_color',
            beforeDraw: (chart) => {
                const ctx = chart.canvas.getContext('2d');
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        }]
    });

    // 入力フォームの画面生成・同期関数
    function renderInputs() {
        inputsContainer.innerHTML = ''; 
        
        chartData.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'input-row';
            
            row.innerHTML = 
                '<input type="text" value="' + item.label + '" data-index="' + index + '" class="item-name-input" placeholder="項目名">' +
                '<div class="slider-container">' +
                    '<input type="range" value="' + item.value + '" data-index="' + index + '" class="item-slider" min="0" max="100">' +
                    '<span class="slider-val" id="val-' + index + '">' + item.value + '</span>' +
                '</div>' +
                '<button class="btn btn-delete" data-index="' + index + '">削除</button>';
            
            inputsContainer.appendChild(row);
        });

        // datasets[0]に修正完了
        myChart.data.labels = chartData.map(d => d.label);
        myChart.data.datasets[0].data = chartData.map(d => d.value);
        myChart.update();
    }

    // スライダー操作イベント
    inputsContainer.addEventListener('input', (e) => {
        const index = parseInt(e.target.dataset.index);
        
        if (e.target.classList.contains('item-name-input')) {
            chartData[index].label = e.target.value;
            myChart.data.labels = chartData.map(d => d.label);
            myChart.update();
        } else if (e.target.classList.contains('item-slider')) {
            const val = parseInt(e.target.value);
            chartData[index].value = val;
            document.getElementById('val-' + index).textContent = val;
            
            // datasets[0]に修正完了
            myChart.data.datasets[0].data[index] = val;
            myChart.update();
        }
    });

    // 削除ボタンの処理
    inputsContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-delete')) {
            const index = parseInt(e.target.dataset.index);
            if (chartData.length <= 3) {
                alert("これ以上項目を減らすことはできません（最低3項目必要です）");
                return;
            }
            chartData.splice(index, 1); 
            renderInputs(); 
        }
    });

    // 新しく項目を追加するボタンの処理
    document.getElementById('addBtn').addEventListener('click', () => {
        const newNum = chartData.length + 1;
        chartData.push({ label: '項目' + newNum, value: 50 }); 
        renderInputs(); 
    });

    // 網目デザインの切り替え
    document.getElementById('gridStyle').addEventListener('change', (e) => {
        myChart.options.scales.r.grid.circular = (e.target.value === 'circle');
        myChart.update();
    });

    // カラーテーマの切り替え
    document.getElementById('colorTheme').addEventListener('change', (e) => {
        const theme = colorThemes[e.target.value];
        // datasets[0]に修正完了
        myChart.data.datasets[0].backgroundColor = theme.bg;
        myChart.data.datasets[0].borderColor = theme.line;
        myChart.data.datasets[0].pointBackgroundColor = theme.point;
        myChart.update();
    });

    // 画像保存ボタンの処理
    document.getElementById('saveBtn').addEventListener('click', () => {
        const imageURI = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'custom-chart.png';
        link.href = imageURI;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // 初回読み込み時の初期表示
    renderInputs();
